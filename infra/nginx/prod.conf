# Nginx 운영 설정 (EC2 배포용)
# SCP로 EC2 /home/ubuntu/ai_project/nginx/default.conf 에 복사해 사용
# 옵션 A: 강의 자료 패턴(/api 프록시) + React SPA 정적 서빙(/)

upstream fastapi {
    server fastapi:8000;
}

server {
    # 팀 공식 도메인 (팀원이 등록·DNS 관리) + EC2 Elastic IP fallback
    server_name healthypeople.kr www.healthypeople.kr 43.202.210.53;
    listen 80;

    # ===== 향후 HTTPS (Certbot ACME challenge) 경로 =====
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ===== 1. API 프록시 (강의 자료 패턴 그대로) =====
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;  # SSE/스트리밍 응답 지연 방지 (RAG 챗봇)

        # 파일 업로드 크기 — OCR 결과지 PDF 대응 (최대 10MB)
        client_max_body_size 10M;
    }

    # ===== 2. React SPA 정적 서빙 (옵션 A 추가분) =====
    # frontend/ckd-care-app/dist 를 SCP로 EC2 → docker volume 마운트 → 이 경로로 노출
    location / {
        root /vol/web/frontend;
        try_files $uri $uri/ /index.html;

        # 정적 자산 캐시 (브라우저 캐시 1시간)
        location ~* \.(?:css|js|ico|svg|png|jpg|jpeg|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
